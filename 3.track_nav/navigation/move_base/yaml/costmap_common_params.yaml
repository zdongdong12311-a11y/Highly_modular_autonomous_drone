# 两张 costmap 共用; launch 分别 load 进 global_costmap / local_costmap
robot_radius: 0.3            # 机体对角 0.45 -> 外接圆 0.225, 留余量

obstacle_layer:
  enabled: true
  combination_method: 1
  obstacle_range: 4.5
  raytrace_range: 6.0
  min_obstacle_height: -5
  max_obstacle_height: 10
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true       # Mid-360 无回波方向输出 inf 时才能参与清除; 转换节点输出 0 就删这行
    min_obstacle_height: -5
    max_obstacle_height: 10

inflation_layer:
  enabled: true
  inflation_radius: 0.5
  cost_scaling_factor: 5.0

static_layer:
  enabled: true              # local 图若没加载 static_layer 插件, 此段自动无效(无害)
# (track_unknown_space 已移走: 它是 costmap 顶层参数, 放层下不生效)
