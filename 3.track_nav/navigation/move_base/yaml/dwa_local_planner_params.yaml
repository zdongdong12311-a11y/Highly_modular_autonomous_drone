DWAPlannerROS:

  # ---- 速度限制 ---- (实际生效上限 = min(这里, 脚本 max_xy_speed 1.5) = 1.0)
  max_vel_x: 1.0
  min_vel_x: -1.0
  max_vel_y: 1.0
  min_vel_y: -1.0
  max_vel_trans: 1.0
  min_vel_trans: 0.05

  # ---- 偏航: 与 navigation_simple.py 的 yaw_rate=0 锁定保持一致 ----
  max_vel_theta: 0.0        # 0.3 -> 0.0 (DWA 不再规划含旋转的轨迹)
  min_vel_theta: 0.0        # -0.3 -> 0.0
  acc_lim_theta: 0.0

  # ---- 加速度 ----
  acc_lim_x: 5.0            # 制动距离 v²/2a = 0.1m, 充裕
  acc_lim_y: 5.0

  # ---- 目标容差 ----
  xy_goal_tolerance: 0.25   # 保持 < 脚本的 0.3
  yaw_goal_tolerance: 6.28  # 1.57 -> 6.28: 航向锁死, SUCCESS 只由 XY 决定
  latch_xy_goal_tolerance: false

  sim_time: 2.5             # 1.0*2.5=2.5m <= 6m 窗的前向 3m
  sim_granularity: 0.05     # 新增: 对齐 costmap 分辨率 (默认 0.025, 浪费 CPU)
  vx_samples: 15
  vy_samples: 15
  vth_samples: 1            # 5 -> 1
  controller_frequency: 10.0  # 必须与 move_base 层的 controller_frequency 一致!

  # ---- 评分 ----
  path_distance_bias: 40.0
  goal_distance_bias: 24.0
  occdist_scale: 0.2        # 0.1 -> 0.2 回到默认 (0.1 比默认还低, 与注释意图相反)
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  publish_traj_pc: true
  publish_cost_grid_pc: true
