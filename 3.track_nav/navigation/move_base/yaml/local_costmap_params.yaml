local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.3     # 1.0 -> 0.3: 局部图要跟得上 1.5m/s 的机体

  rolling_window: true         

  width: 6                     # 5 -> 6: 前向可见范围需覆盖 DWA 前瞻 (见公式)
  height: 6
  resolution: 0.05             # 0.03 -> 0.05 (可选)

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
